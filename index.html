<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop outerwear and T-shirts for men and women.">
  <meta name="theme-color" content="#ffffff">
  <title>SHOP</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/shop-icon-32.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <input class="menu-toggle" type="checkbox" id="menu-toggle" aria-label="Toggle navigation">
    <div class="toolbar">
      <label class="menu-button" for="menu-toggle" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </label>

      <a class="logo" href="index.html" aria-label="SHOP home">SHOP</a>

      <a class="cart-link" href="#" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM1 2v2h2l3.6 7.59-1.35 2.45A2 2 0 0 0 7 17h12v-2H7.42a.25.25 0 0 1-.25-.25l.03-.12.9-1.63h7.45a2 2 0 0 0 1.75-1.03l3.58-6.49A1 1 0 0 0 20 4H5.21l-.94-2H1Z"/></svg>
      </a>
    </div>

    <nav class="category-nav" aria-label="Shop categories">
      <a href="mens_outerwear.html">Men's Outerwear</a>
      <a href="ladies_outerwear.html">Ladies Outerwear</a>
      <a href="mens_tshirts.html">Men's T-Shirts</a>
      <a href="#ladies-tshirts">Ladies T-Shirts</a>
    </nav>

    <nav class="mobile-nav" aria-label="Mobile shop categories">
      <a href="mens_outerwear.html">Men's Outerwear</a>
      <a href="ladies_outerwear.html">Ladies Outerwear</a>
      <a href="mens_tshirts.html">Men's T-Shirts</a>
      <a href="#ladies-tshirts">Ladies T-Shirts</a>
    </nav>
    <label class="drawer-backdrop" for="menu-toggle" aria-label="Close navigation"></label>
  </header>

  <main class="shop-home">
    <section class="category category-featured" id="mens-outerwear" aria-labelledby="mens-outerwear-title">
      <a class="category-image" href="mens_outerwear.html">
        <img src="images/mens_outerwear.jpg" alt="Men's outerwear collection">
      </a>
      <h1 id="mens-outerwear-title">Men's Outerwear</h1>
      <a class="shop-button" href="mens_outerwear.html">Shop Now</a>
    </section>

    <section class="category category-featured" id="ladies-outerwear" aria-labelledby="ladies-outerwear-title">
      <a class="category-image" href="ladies_outerwear.html">
        <img src="images/ladies_outerwear.jpg" alt="Ladies outerwear collection">
      </a>
      <h2 id="ladies-outerwear-title">Ladies Outerwear</h2>
      <a class="shop-button" href="ladies_outerwear.html">Shop Now</a>
    </section>

    <div class="category-row">
      <section class="category category-compact" id="mens-tshirts" aria-labelledby="mens-tshirts-title">
        <a class="category-image" href="mens_tshirts.html">
          <img src="images/mens_tshirts.jpg" alt="Men's T-shirts collection">
        </a>
        <h2 id="mens-tshirts-title">Men's T-Shirts</h2>
        <a class="shop-button" href="mens_tshirts.html">Shop Now</a>
      </section>

      <section class="category category-compact" id="ladies-tshirts" aria-labelledby="ladies-tshirts-title">
        <a class="category-image" href="#ladies-tshirts-title">
          <img src="images/ladies_tshirts.jpg" alt="Ladies T-shirts collection">
        </a>
        <h2 id="ladies-tshirts-title">Ladies T-Shirts</h2>
        <a class="shop-button" href="#ladies-tshirts-title">Shop Now</a>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <a href="https://www.polymer-project.org/3.0/toolbox/" target="_blank" rel="noopener noreferrer">Made by Polymer</a>
    <div class="demo-label">Demo Only</div>
  </footer>
  <script>
    const menuToggle = document.getElementById("menu-toggle");
    const siteHeader = document.querySelector(".site-header");
    let lastScrollY = window.scrollY;

    document.querySelectorAll(".mobile-nav a").forEach((link) => {
      link.addEventListener("click", () => {
        menuToggle.checked = false;
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        menuToggle.checked = false;
      }
    });

    window.addEventListener("scroll", () => {
      const currentScrollY = window.scrollY;

      if (menuToggle.checked || currentScrollY === 0) {
        siteHeader.classList.remove("is-hidden");
      } else if (currentScrollY < lastScrollY) {
        siteHeader.classList.add("is-hidden");
      } else if (currentScrollY > lastScrollY) {
        siteHeader.classList.remove("is-hidden");
      }

      lastScrollY = currentScrollY;
    }, { passive: true });
  </script>
</body>
</html>
